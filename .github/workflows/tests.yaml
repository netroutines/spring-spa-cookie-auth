name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Frontend, Backend and Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/main/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/main/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: src/main/frontend
        run: npm run lint

      - name: Test frontend
        working-directory: src/main/frontend
        run: npm run test

      - name: Build frontend
        working-directory: src/main/frontend
        run: npm run build

      - name: Verify backend and package JAR
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify

      - name: Smoke test H2 demo
        run: |
          java -jar target/spring-spa-cookie-auth-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=demo > app.log 2>&1 &

          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat app.log
              exit 1
            fi

            if curl --fail --silent --output /dev/null http://127.0.0.1:8080/ &&
               curl --fail --silent --output /dev/null http://127.0.0.1:8080/api/auth/csrf; then
              echo "H2 demo started successfully."
              exit 0
            fi

            sleep 2
          done

          cat app.log
          exit 1
