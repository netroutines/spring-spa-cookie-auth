# Application
spring.application.name=spring-spa-cookie-auth

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/my_agenda
spring.datasource.username=my_agenda_app
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# JDBC errors can contain a failing row (including its password hash).
# Application error handlers log sanitized classifications instead.
spring.jpa.properties.hibernate.jdbc.log.errors=false

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog.xml

# Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
