# In-memory database for local demonstrations
spring.datasource.url=jdbc:h2:mem:spacookieauth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep the demo accessible only from the local machine
server.address=127.0.0.1
