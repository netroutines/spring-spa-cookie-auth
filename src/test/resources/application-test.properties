# No test context may create a connection to the development database.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,org.springframework.boot.liquibase.autoconfigure.LiquibaseAutoConfiguration
spring.liquibase.enabled=false
spring.datasource.url=jdbc:disabled:tests
spring.datasource.username=unused
spring.datasource.password=

# Failure diagnostics must not dump login bodies, session cookies or CSRF tokens.
spring.test.mockmvc.print=none
